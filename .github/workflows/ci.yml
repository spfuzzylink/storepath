name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-source:
    name: Public source and history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test publication guard
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Inspect tracked source and full reachable history
        run: python3 scripts/check-public-source.py
  go:
    name: Go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux/amd64
            suffix: linux_amd64
          - os: ubuntu-24.04-arm
            target: linux/arm64
            suffix: linux_arm64
          - os: macos-15-intel
            target: darwin/amd64
            suffix: darwin_amd64
          - os: macos-15
            target: darwin/arm64
            suffix: darwin_arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Check Go formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Test installer and archive boundaries
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build release archive
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: python3 scripts/package.py --target "$PACKAGE_TARGET"
      - name: Verify and exercise the packaged executable
        env:
          PACKAGE_SUFFIX: ${{ matrix.suffix }}
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum -c checksums.txt
          else
            shasum -a 256 -c checksums.txt
          fi
          mkdir unpacked
          tar -xzf "storepath_$(cat ../VERSION)_${PACKAGE_SUFFIX}.tar.gz" -C unpacked
          test "$(unpacked/storepath version)" = "$(cat ../VERSION)"
          unpacked/storepath help
          unpacked/storepath demo
      - name: Retain tested archive for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storepath-${{ matrix.suffix }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  minimum-go:
    name: Minimum Go 1.26
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache: false
      - run: go test ./...
  browser-demo:
    name: Offline browser engine and release HTML
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install browser test tools
        run: npm ci
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Build self-contained browser artifact
        run: python3 scripts/build-demo.py
      - name: Test actual embedded engine against native CLI
        run: node scripts/test-demo.mjs
      - name: Exercise offline browser interactions and exports
        run: npm run test:ui
      - name: Retain tested HTML for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storepath-browser-demo
          path: dist/storepath-demo.html
          if-no-files-found: error
          retention-days: 7
      - name: Package tested site for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/site
  deploy-pages:
    name: Publish tested interactive demo
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [public-source, go, minimum-go, browser-demo]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  release:
    name: Publish tested experimental release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [public-source, go, minimum-go, browser-demo]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: storepath-*
          path: dist
          merge-multiple: true
      - name: Create checksum manifest
        run: |
          cd dist
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 4
          test -s storepath-demo.html
          sha256sum *.tar.gz storepath-demo.html > checksums.txt
      - name: Publish tested native archives and offline browser demo
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/storepath-demo.html dist/checksums.txt
          --verify-tag --prerelease --title "Storepath ${RELEASE_TAG}"
          --notes-file docs/release-notes.md
